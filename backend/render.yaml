services:
  - type: web
    name: ai-code-review-backend
    env: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma db push && npx prisma generate && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
